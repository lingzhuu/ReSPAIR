[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "respair"
version = "0.1.0"
description = "Pair-specific gene–metabolite links in spatial multi-omics, after removing low-rank tissue confounding"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Lingzhu" }]
keywords = ["spatial transcriptomics", "spatial metabolomics", "multi-omics", "MSI", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
# simulation benchmark and baselines (the MANTIS re-implementation needs scikit-learn)
benchmarks = ["scikit-learn>=1.2", "matplotlib>=3.6"]
test = ["pytest>=7", "pytest-cov"]
doc = ["sphinx>=7", "myst-parser>=2", "furo", "sphinx-copybutton"]
dev = ["respair[test,benchmarks]", "pre-commit", "ruff"]

[project.urls]
Homepage = "https://github.com/lingzhuu/ReSPAIR"
Documentation = "https://respair.readthedocs.io"
Source = "https://github.com/lingzhuu/ReSPAIR"
"Bug Tracker" = "https://github.com/lingzhuu/ReSPAIR/issues"
Changelog = "https://github.com/lingzhuu/ReSPAIR/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/respair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["ignore:respair.fit:DeprecationWarning"]
markers = ["slow: full-size simulations, skipped unless --runslow"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B"]
ignore = [
    "E702",  # several statements on one line (common for array assignments in the simulator)
    "E741",  # variable names l / I (match the notation in the equations)
    "B008",
    "B905",  # zip(strict=) is not enforced
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["E401", "E402", "F401", "I001", "B007", "B905"]
"tests/**" = ["E402"]
# baseline wrappers import their optional dependencies inside functions
"benchmarks/scripts/baselines.py" = ["E401", "I001"]

[tool.coverage.run]
source = ["respair"]
